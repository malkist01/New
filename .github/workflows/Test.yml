name: CI (with KernelSU)

on:
  workflow_dispatch:
    inputs:
      kernel-branch:
        required: true
        type: string
      release-type:
        required: true
        type: choice
        options:
        - kaihatsu
        - seishiki
        default: 'kaihatsu'
      device-codename:
        required: true
        type: choice
        options:
        - ginkgo
        - willow

jobs:
  build-kernel:
    name: Build Kernel with KernelSU
    runs-on: ubuntu-latest
    steps:
      - name: Display parameters
        uses: m-s-abeer/update-gha-summary-with-workflow-inputs@v1

      - name: Build
        uses: frstprjkt/kernel_actions@main
        with:
          kernel-url: https://github.com/malkist01/New
          kernel-branch: ${{ github.event.inputs.kernel-branch }}

          arch: arm64
          defconfig: vendor/ginkgo_defconfig
          extra-args: LLVM=1 LLVM_IAS=1 KBUILD_BUILD_USER=malkist001

          ksu: true
          ksu-url: https://github.com/sidex15/KernelSU-Next
          ksu-version: legacy-susfs-v2

          aosp-gcc: true
          aosp-clang: true
          aosp-clang-version: r547379

          anykernel3: true
          anykernel3-url: https://github.com/malkist01/AnyKernel3
          anykernel3-branch: ${{ github.event.inputs.device-codename }}

          package-name: teletubies-ksu_$(date +%d%H%M)_${{ github.event.inputs.device-codename }}-${{ github.event.inputs.release-type }}
